[project]
name = "asecli"
version = "0.1.0"
description = "Agent-native CLI for reading, modifying, validating and compiling Amplify Shader Editor assets"
requires-python = ">=3.10"
dependencies = []

[dependency-groups]
dev = ["pytest>=8.0"]

[project.scripts]
asecli = "asecli.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/asecli"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["bridge: requires a running Unity/Tuanjie editor"]
