[project]
name = "asecli"
version = "0.6.1"
description = "Agent-native CLI for reading, modifying, validating and compiling Amplify Shader Editor assets"
requires-python = ">=3.10"
dependencies = []
license = "MIT"

[dependency-groups]
dev = ["hatchling==1.32.0", "pytest>=8.0"]

[project.scripts]
asecli = "asecli.cli.main:app"

[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/asecli"]

# The Agent Skill is a versioned part of the CLI deliverable.  Keep its
# authoring location discoverable at the repository root while shipping it
# inside the Python package so `asecli install-skill` can install it after a
# wheel-based CLI install.
[tool.hatch.build.targets.wheel.force-include]
"skills/asecli" = "asecli/skills/asecli"

[tool.hatch.build.targets.sdist]
# Release/audit records contain artifact evidence and are kept outside the
# distributable source archive to avoid self-referential checksum drift.
exclude = [
  "/docs/03-quality/evidence",
  "/docs/04-delivery/releases",
  "/docs/05-audits",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["bridge: requires a running Unity/Tuanjie editor"]
