[project]
name = "asecli"
version = "0.6.4"
description = "Agent-native CLI for reading, modifying, validating and compiling Amplify Shader Editor assets"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "AseCLI contributors" }]
keywords = ["amplify-shader-editor", "ase", "unity", "shader", "cli"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Build Tools",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/seeseeczl/ASECLI"
Repository = "https://github.com/seeseeczl/ASECLI"
Issues = "https://github.com/seeseeczl/ASECLI/issues"
Changelog = "https://github.com/seeseeczl/ASECLI/releases"

[dependency-groups]
dev = ["hatchling==1.32.0", "pytest>=8.0"]

[project.scripts]
asecli = "asecli.cli.main:app"

[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/asecli"]

# The Agent Skill is a versioned part of the CLI deliverable.  Keep its
# authoring location discoverable at the repository root while shipping it
# inside the Python package so `asecli install-skill` can install it after a
# wheel-based CLI install.
[tool.hatch.build.targets.wheel.force-include]
"skills/asecli" = "asecli/skills/asecli"

[tool.hatch.build.targets.sdist]
# Release/audit records contain artifact evidence and are kept outside the
# distributable source archive to avoid self-referential checksum drift.
exclude = [
  "/docs/03-quality/evidence",
  "/docs/04-delivery/releases",
  "/docs/05-audits",
  "/e2e-results",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["bridge: requires a running Unity/Tuanjie editor"]
