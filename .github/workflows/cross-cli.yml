name: Cross CLI Contract Gate

on:
  workflow_call:
    inputs:
      sgcli_ref:
        description: SGCLI candidate branch, tag, or commit
        required: false
        default: main
        type: string
  workflow_dispatch:
    inputs:
      sgcli_ref:
        description: SGCLI candidate branch, tag, or commit
        required: true
        default: main

permissions:
  contents: read

jobs:
  two-wheel-direct-json:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          repository: seeseeczl/SGCLI
          ref: ${{ inputs.sgcli_ref || 'main' }}
          path: SGCLI
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.14"
          python-version: "3.12"
      - name: Build candidate wheels
        run: |
          uv build --wheel --out-dir "$RUNNER_TEMP/asecli-wheel"
          (cd SGCLI && uv build --wheel --out-dir "$RUNNER_TEMP/sgcli-wheel")
      - name: Run no-transform two-wheel matrix
        run: >-
          python SGCLI/scripts/check_cross_cli_contracts.py
          --sgcli-root SGCLI
          --asecli-root .
          --sgcli-wheel "$RUNNER_TEMP"/sgcli-wheel/*.whl
          --asecli-wheel "$RUNNER_TEMP"/asecli-wheel/*.whl
          --output "$RUNNER_TEMP/cross-cli-artifacts/manifest.json"
          --artifact-dir "$RUNNER_TEMP/cross-cli-artifacts"
          --sgcli-ref "${{ inputs.sgcli_ref || 'main' }}"
          --asecli-ref "${{ github.ref }}"
          --workflow-revision "${{ github.workflow_ref }}@${{ github.sha }}"
      - name: Verify downloaded-artifact shape and hashes
        run: >-
          python SGCLI/scripts/verify_cross_cli_artifacts.py
          "$RUNNER_TEMP/cross-cli-artifacts/manifest.json"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: cross-cli-contracts
          path: ${{ runner.temp }}/cross-cli-artifacts/
          if-no-files-found: error
