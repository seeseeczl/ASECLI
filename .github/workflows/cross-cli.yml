name: Cross CLI Contract Gate

on:
  workflow_call:
    inputs:
      sgcli_ref:
        description: Exact trusted SGCLI commit
        required: false
        default: ""
        type: string
      asecli_artifact_name:
        description: Build-once ASECLI candidate artifact from the caller
        required: false
        default: ""
        type: string
    secrets:
      sgcli_read_ssh_key:
        description: Read-only deploy key for the private SGCLI repository
        required: false
  workflow_dispatch:
    inputs:
      sgcli_ref:
        description: Exact trusted SGCLI commit
        required: true
        type: string
      asecli_artifact_name:
        description: Existing ASECLI candidate artifact in this run; blank builds for diagnostics
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  public-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.14"
          python-version: "3.12"
      - run: uv sync --frozen --python 3.12
      - name: Validate public/fork-safe consumer contracts
        run: uv run --frozen python -m pytest -q tests/test_contract_schema.py
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: ${{ inputs.asecli_artifact_name != '' }}
        with:
          name: ${{ inputs.asecli_artifact_name }}
          path: ${{ runner.temp }}/asecli-candidate
      - name: Smoke test the build-once candidate wheel
        if: ${{ inputs.asecli_artifact_name != '' }}
        run: |
          uv venv "$RUNNER_TEMP/asecli-public-smoke" --python 3.12
          uv pip install --python "$RUNNER_TEMP/asecli-public-smoke/bin/python" "$RUNNER_TEMP"/asecli-candidate/*.whl
          "$RUNNER_TEMP/asecli-public-smoke/bin/asecli" contract editor-graph --version 3
      - name: Record candidate gate boundary
        if: ${{ github.event_name == 'pull_request' }}
        run: >-
          echo 'Private SGCLI candidate checkout is intentionally not available to pull requests;
          the private SGCLI repository owns the full two-candidate WaveNoise gate.'

  two-wheel-direct-json:
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - name: Validate trusted cross-repository inputs
        env:
          SGCLI_REF: ${{ inputs.sgcli_ref }}
          SGCLI_READ_SSH_KEY: ${{ secrets.sgcli_read_ssh_key }}
        run: |
          test -n "$SGCLI_REF" || { echo "CROSS_REPO_REF_MISSING: configure SGCLI_CANDIDATE_SHA"; exit 2; }
          [[ "$SGCLI_REF" =~ ^[0-9a-fA-F]{40}$ ]] || { echo "CROSS_REPO_REF_INVALID: SGCLI_CANDIDATE_SHA must be an exact 40-character commit SHA"; exit 2; }
          test -n "$SGCLI_READ_SSH_KEY" || { echo "CROSS_REPO_AUTH_MISSING: configure read-only SGCLI_READ_SSH_KEY deploy key"; exit 2; }
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          path: ASECLI
          persist-credentials: false
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          repository: seeseeczl/SGCLI
          ref: ${{ inputs.sgcli_ref }}
          ssh-key: ${{ secrets.sgcli_read_ssh_key }}
          path: SGCLI
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.14"
          python-version: "3.12"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: ${{ inputs.asecli_artifact_name != '' }}
        with:
          name: ${{ inputs.asecli_artifact_name }}
          path: ${{ runner.temp }}/asecli-candidate
      - name: Build ASECLI candidate for manual dispatch
        if: ${{ inputs.asecli_artifact_name == '' }}
        run: (cd ASECLI && uv build --wheel --out-dir "$RUNNER_TEMP/asecli-candidate")
      - name: Build exact SGCLI candidate
        run: (cd SGCLI && uv build --wheel --out-dir "$RUNNER_TEMP/sgcli-wheel")
      - name: Run no-transform two-wheel WaveNoise matrix
        run: >-
          python SGCLI/scripts/check_cross_cli_contracts.py
          --sgcli-root SGCLI
          --asecli-root ASECLI
          --sgcli-wheel "$RUNNER_TEMP"/sgcli-wheel/*.whl
          --asecli-wheel "$RUNNER_TEMP"/asecli-candidate/*.whl
          --output "$RUNNER_TEMP/cross-cli-artifacts/manifest.json"
          --artifact-dir "$RUNNER_TEMP/cross-cli-artifacts"
          --sgcli-ref "${{ inputs.sgcli_ref }}"
          --asecli-ref "${{ github.sha }}"
          --workflow-revision "${{ github.workflow_ref }}@${{ github.sha }}"
      - name: Verify downloaded-artifact shape and hashes
        run: >-
          python SGCLI/scripts/verify_cross_cli_artifacts.py
          "$RUNNER_TEMP/cross-cli-artifacts/manifest.json"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: cross-cli-contracts-${{ github.sha }}
          path: ${{ runner.temp }}/cross-cli-artifacts/
          if-no-files-found: error
