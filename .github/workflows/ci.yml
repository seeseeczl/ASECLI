name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@b75a909f75acd358c2196fb9a5f1299a9a8868a4 # v6.7.0
        with:
          version: "0.11.14"
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv lock --check
      - run: uv sync --frozen --python ${{ matrix.python-version }}
      - run: uv run --frozen --python ${{ matrix.python-version }} pytest -q
      - run: uv run --frozen --python ${{ matrix.python-version }} python tools/check_ci_governance.py
      - run: uv run --frozen --python ${{ matrix.python-version }} python tools/check_regression_catalog.py

  package:
    needs: verify
    runs-on: ubuntu-latest
    env:
      SOURCE_DATE_EPOCH: "1788220800"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@b75a909f75acd358c2196fb9a5f1299a9a8868a4 # v6.7.0
        with:
          version: "0.11.14"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --frozen --python 3.12
      - run: uv build --out-dir build-a
      - run: uv build --out-dir build-b
      - run: cmp build-a/asecli-0.1.0-py3-none-any.whl build-b/asecli-0.1.0-py3-none-any.whl
      - run: cmp build-a/asecli-0.1.0.tar.gz build-b/asecli-0.1.0.tar.gz
      - run: mkdir dist && cp build-a/* dist/
      - run: shasum -a 256 dist/*.whl dist/*.tar.gz > dist/SHA256SUMS
      - run: uv run --frozen python tools/generate_sbom.py --dist dist --output dist/asecli-0.1.0.spdx.json
      - run: uv run --frozen python tools/supply_chain_check.py --output dist/supply-chain-check.json
      - run: uv venv .artifact-venv --python 3.12
      - run: uv pip install --python .artifact-venv/bin/python dist/asecli-0.1.0-py3-none-any.whl
      - run: .artifact-venv/bin/asecli parse tests/fixtures/step-antialiasing.function.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: asecli-0.1.0-python-${{ runner.arch }}
          path: dist/
          if-no-files-found: error
